{% extends "base.html" %}

{% block title %}
Register - PocketSmart AI
{% endblock %}

{% block content %}

<div class="container auth-container">

    <div class="form-card">

        <h1>
            Create your account
        </h1>

        <p>
            Save your AI recommendations and access
            them later.
        </p>

        <div id="auth-error"></div>

        <form
            onsubmit="submitAuthForm(
                event,
                '/api/auth/register'
            )"
        >

            <div class="form-group">
                <label>
                    Name
                </label>

                <input
                    type="text"
                    name="name"
                    required
                    minlength="2"
                >
            </div>

            <br>

            <div class="form-group">
                <label>
                    Email
                </label>

                <input
                    type="email"
                    name="email"
                    required
                >
            </div>

            <br>

            <div class="form-group">
                <label>
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    required
                    minlength="6"
                >
            </div>

            <br>

            <button
                class="btn btn-primary"
                type="submit"
            >
                Create Account
            </button>

        </form>

        <p>
            Already registered?
            <a href="/login">
                Login
            </a>
        </p>

    </div>

</div>

{% endblock %}
