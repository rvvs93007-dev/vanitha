{% extends "base.html" %}

{% block title %}
Login - PocketSmart AI
{% endblock %}

{% block content %}

<div class="container auth-container">

    <div class="form-card">

        <h1>
            Welcome back
        </h1>

        <p>
            Login to access your saved recommendations.
        </p>

        <div id="auth-error"></div>

        <form
            onsubmit="submitAuthForm(
                event,
                '/api/auth/login'
            )"
        >

            <div class="form-group">

                <label>
                    Email
                </label>

                <input
                    type="email"
                    name="email"
                    required
                >

            </div>

            <br>

            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    required
                >

            </div>

            <br>

            <button
                class="btn btn-primary"
                type="submit"
            >
                Login
            </button>

        </form>

        <p>
            Don't have an account?
            <a href="/register">
                Register
            </a>
        </p>

    </div>

</div>

{% endblock %}
